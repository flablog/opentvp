name: release
# Pousser un tag vX.Y.Z (identique au fichier VERSION) publie une release avec les binaires.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r python/requirements.txt ziglang==0.17.0
      - name: Version du tag = fichier VERSION
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      - run: ./tests/run_all.sh
      - run: ./c/build.sh all && ./c/package.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
